<!DOCTYPE html>
<html>
<head>
    <title>Kranti - E-Book Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR START -->
<nav class="navbar">
    <div class="navbar-left">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="about.html" class="nav-link">About Author</a>
    </div>
    <div class="navbar-right">
        <div class="profile-container" id="profileContainer" style="display:none;">
            <img id="profileImage" class="profile-pic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23ddd'/%3E%3Ccircle cx='50' cy='35' r='15' fill='%23999'/%3E%3Cpath d='M 20 70 Q 50 60 80 70' fill='%23999'/%3E%3C/svg%3E" onclick="toggleProfileDropdown()">
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="#" onclick="viewProfile()">👤 View Profile</a>
                <a href="#" onclick="logout()">🚪 Sign Out</a>
            </div>
        </div>
        <div id="authButtons" class="auth-buttons">
            <button onclick="openLoginModal()" class="btn-login">Sign In</button>
            <button onclick="openSignupModal()" class="btn-signup">Sign Up</button>
        </div>
    </div>
</nav>
<!-- NAVBAR END -->

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeLoginModal()">&times;</span>
        <h2>Sign In</h2>
        <form>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="button" onclick="login()" class="button">Sign In</button>
        </form>
    </div>
</div>

<!-- Signup Modal -->
<div id="signupModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeSignupModal()">&times;</span>
        <h2>Sign Up</h2>
        <form>
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
            <button type="button" onclick="signup()" class="button">Create Account</button>
        </form>
    </div>
</div>

<div class="main-content">
    <h1>Welcome to Kranti</h1>

    <!-- Book Section -->
    <div class="book-section">
        <h2>Available Book</h2>
        <img src="book.jpg" id="bookImage" onclick="openBook()" class="book-image">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
